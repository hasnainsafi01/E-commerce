<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MyMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        body.admin-login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f7fa 0%, #e8f0ff 100%);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,82,204,0.12);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-brand i {
            font-size: 2.5rem;
            color: var(--admin-primary);
        }
        .login-brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            color: var(--admin-text);
            margin: 0.5rem 0 0.25rem;
        }
        .login-brand p {
            color: var(--admin-text-muted);
            font-size: 0.875rem;
        }
        .login-form .form-group {
            margin-bottom: 1.25rem;
        }
        .login-form label {
            display: block;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--admin-text);
            margin-bottom: 0.4rem;
        }
        .login-form input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--admin-border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--admin-text);
            background: #f9fafb;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--admin-primary);
            background: #fff;
        }
        .login-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--admin-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .login-btn:hover { background: #003fa3; }
        .login-btn:active { transform: scale(0.99); }
        .login-btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .login-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--admin-text-muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--admin-primary); }
    </style>
    <script>
        // DEBUG MODE BYPASS: Redirect to dashboard instantly
        window.location.replace('index.html');
    </script>
</head>
<body class="admin-login-page">

    <div class="login-card">
        <div class="login-brand">
            <i class="fas fa-shield-alt"></i>
            <h1>MyMart Admin</h1>
            <p>Sign in with your administrator credentials</p>
        </div>

        <div class="login-error" id="login-error"></div>

        <form class="login-form" id="admin-login-form" novalidate>
            <div class="form-group">
                <label for="admin-email">Email Address</label>
                <input type="email" id="admin-email" placeholder="admin@mymart.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Store
        </a>
    </div>

    <script src="../js/admin-login.js" type="module"></script>
</body>
</html>
