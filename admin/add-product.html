<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | MyMart Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body admin-loading">

    <!-- Admin Loader Overlay -->
    <div id="admin-loader" style="position: fixed; inset: 0; background: #fff; z-index: 100000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem;">
        <div style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="font-family: 'Outfit', sans-serif; font-weight: 600; color: var(--primary); letter-spacing: 1px;">VERIFYING PERMISSIONS...</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-bolt"></i> <span>MyMart Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
            <a href="add-product.html" class="nav-link active"><i class="fas fa-plus-circle"></i> <span>Add Product</span></a>
            <a href="products.html" class="nav-link"><i class="fas fa-box"></i> <span>Manage Products</span></a>
            <a href="orders.html" class="nav-link"><i class="fas fa-shopping-bag"></i> <span>Orders</span></a>
            <a href="users.html" class="nav-link"><i class="fas fa-users"></i> <span>Manage Users</span></a>
            <a href="history.html" class="nav-link"><i class="fas fa-history"></i> <span>History</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="nav-link view-site-btn"><i class="fas fa-external-link-alt"></i> <span>View Website</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div>
                <h1>Add New Product</h1>
                <p class="text-muted">Register a new item in your store's inventory.</p>
            </div>
            <button class="btn btn-primary" id="save-product-btn" form="product-form">
                <i class="fas fa-save"></i> Save Product
            </button>
        </header>

        <div class="admin-card">
            <div class="card-header">
                <h3>Product Information</h3>
            </div>
            <div class="card-body">
                <form id="product-form" class="admin-form">
                    <div class="form-group full-width">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" placeholder="e.g. Minimalist Urban Watch" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productPrice">Price ($)</label>
                            <input type="number" id="productPrice" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="">Select Category</option>
                                <option value="shoes">Shoes</option>
                                <option value="bags">Bags</option>
                                <option value="watches">Watches</option>
                                <option value="glasses">Glasses</option>
                                <option value="men">Men</option>
                                <option value="women">Women</option>
                                <option value="electronics">Electronics</option>
                                <option value="home">Home</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productSizes">Sizes (Comma separated)</label>
                            <input type="text" id="productSizes" placeholder="Small, Medium, Large">
                        </div>
                        <div class="form-group">
                            <label for="productVariants">Variants (Comma separated)</label>
                            <input type="text" id="productVariants" placeholder="128GB, 256GB, 512GB">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="stock">Stock Quantity</label>
                            <input type="number" id="stock" placeholder="100" required>
                        </div>
                        <div class="form-group">
                            <label for="productColors">Colors (Comma separated)</label>
                            <input type="text" id="productColors" placeholder="Slate, Black, Silver">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" rows="5" placeholder="Detailed product description..." required></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Product Image</label>
                        <label class="upload-dropzone" id="image-dropzone" for="productImage">
                            <div id="upload-placeholder">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Click to select image from your device</p>
                                <span style="font-size: 0.8rem; opacity: 0.7;">(JPG, PNG or WEBP)</span>
                            </div>
                            <div id="upload-preview" style="display: none;">
                                <img src="" id="preview-img" style="max-width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px;">
                                <p style="margin-top: 10px; font-size: 0.8rem; color: var(--admin-primary); font-weight: 500;">Image Selected - Click to change</p>
                            </div>
                            <input type="file" id="productImage" accept="image/*" style="display: none;" required>
                        </label>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/admin-guard.js" type="module"></script>
    <script src="../js/admin.js" type="module"></script>
</body>
</html>
