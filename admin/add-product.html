<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | MyMart Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <!-- Critical Security Styles: Prevents UI flicker before JS auth check -->
    <style>
        body.admin-loading .admin-sidebar,
        body.admin-loading .admin-main {
            display: none !important;
        }
    </style>
</head>
<body class="admin-body admin-loading">

    <!-- Admin Loader Overlay -->
    <div id="admin-loader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <h2>Securing Session</h2>
            <p>Verifying administrator privileges...</p>
        </div>
    </div>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <a href="index.html" class="sidebar-brand">
            <i class="fas fa-bolt"></i> <span>MyMart Admin</span>
        </a>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
            <a href="add-product.html" class="nav-link active"><i class="fas fa-plus-circle"></i> <span>Add Product</span></a>
            <a href="products.html" class="nav-link"><i class="fas fa-box"></i> <span>Manage Products</span></a>
            <a href="orders.html" class="nav-link"><i class="fas fa-shopping-bag"></i> <span>Orders</span></a>
            <a href="users.html" class="nav-link"><i class="fas fa-users"></i> <span>Manage Users</span></a>
            <a href="history.html" class="nav-link"><i class="fas fa-history"></i> <span>History</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="nav-link"><i class="fas fa-external-link-alt"></i> <span>View Website</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div>
                <h1>Add New Product</h1>
                <p style="color: var(--admin-text-muted);">Expand your inventory with new premium items.</p>
            </div>
            <button class="btn btn-primary" id="save-product-btn" form="product-form">
                <i class="fas fa-save"></i> Save Product
            </button>
        </header>

        <div class="admin-card">
            <div class="card-header">
                <h3>Product Details</h3>
            </div>
            <div style="padding: 2rem;">
                <form id="product-form" class="admin-form">
                    <div class="form-group full-width">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" placeholder="e.g. Minimalist Slate Watch" required>
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Price ($)</label>
                        <input type="number" id="productPrice" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="trending">Trending Now</option>
                            <option value="shoes">Shoes</option>
                            <option value="bags">Bags</option>
                            <option value="watches">Watches</option>
                            <option value="glasses">Glasses</option>
                            <option value="men">Men's Fashion</option>
                            <option value="women">Women's Fashion</option>
                            <option value="electronics">Electronics</option>
                            <option value="home">Home & Lifestyle</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Quantity</label>
                        <input type="number" id="stock" placeholder="100" required>
                    </div>

                    <div class="form-group">
                        <label for="productColors">Colors (Comma separated)</label>
                        <input type="text" id="productColors" placeholder="Slate, Black, Silver">
                    </div>

                    <div class="form-group full-width">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" rows="5" placeholder="Describe the product details..." required></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label class="upload-dropzone" id="image-dropzone" for="productImage">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click or drag image to upload to Cloudinary</p>
                            <input type="file" id="productImage" accept="image/*" style="display: none;">
                        </label>
                        <div id="image-preview-container" class="preview-grid">
                            <!-- Preview Image -->
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/admin-guard.js" type="module"></script>
    <script src="../js/admin.js" type="module"></script>
</body>
</html>
