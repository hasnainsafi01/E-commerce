<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | MyMart Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-bolt"></i> <span>MyMart Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
            <a href="add-product.html" class="nav-link"><i class="fas fa-plus-circle"></i> <span>Add Product</span></a>
            <a href="products.html" class="nav-link active"><i class="fas fa-box"></i> <span>Manage Products</span></a>
            <a href="orders.html" class="nav-link"><i class="fas fa-shopping-bag"></i> <span>Orders</span></a>
            <a href="users.html" class="nav-link"><i class="fas fa-users"></i> <span>Manage Users</span></a>
            <a href="history.html" class="nav-link"><i class="fas fa-history"></i> <span>History</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="nav-link view-site-btn"><i class="fas fa-external-link-alt"></i> <span>View Website</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div>
                <h1>Manage Products</h1>
                <p class="text-muted">Review, edit, and control your product catalog.</p>
            </div>
            <a href="add-product.html" class="btn btn-primary"><i class="fas fa-plus"></i> Add New Product</a>
        </header>

        <!-- Filters Bar -->
        <div class="admin-card filter-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Search by name or category...">
            </div>
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="shoes">Shoes</option>
                <option value="bags">Bags</option>
                <option value="watches">Watches</option>
                <option value="glasses">Glasses</option>
                <option value="men">Men's Fashion</option>
                <option value="women">Women's Fashion</option>
                <option value="electronics">Electronics</option>
                <option value="essentials">Essentials</option>
                <option value="trending">Trending Now</option>
                <option value="clothing">Clothing</option>
            </select>
        </div>

        <div class="admin-card">
            <table class="admin-table" id="products-table">
                <thead>
                    <tr>
                        <th>Preview</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/admin-guard.js" type="module"></script>
    <script src="../js/admin.js" type="module"></script>
</body>
</html>
